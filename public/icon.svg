<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners for squircle/maskable icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing shield outline -->
  <path d="M256 72 L392 136 C392 264 336 360 256 424 C176 360 120 264 120 136 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner shield fill -->
  <path d="M256 96 L368 152 C368 256 320 336 256 392 C192 336 144 256 144 152 Z" 
        fill="#091326" 
        stroke="#38bdf8" 
        stroke-width="6"/>

  <!-- Phone call receiver with block mark -->
  <g transform="translate(186, 176) scale(0.65)" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M106.67 170.67C149.33 213.33 192 256 234.67 256C245.33 256 256 245.33 256 234.67L288 181.33C293.33 170.67 288 160 277.33 154.67L224 133.33C213.33 128 202.67 133.33 197.33 144L181.33 165.33C144 144 112 112 90.67 74.67L112 58.67C122.67 53.33 128 42.67 122.67 32L101.33 -21.33C96 -32 85.33 -37.33 74.67 -32L21.33 0C10.67 5.33 0 16 0 26.67C0 69.33 42.67 112 85.33 154.67" transform="translate(0, 50)" />
  </g>

  <!-- Cross/Slash for Block -->
  <circle cx="256" cy="244" r="68" fill="none" stroke="#f43f5e" stroke-width="14" />
  <line x1="208" y1="196" x2="304" y2="292" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" />

  <!-- S26 Text Badge -->
  <text x="256" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="4">SHIELD S26</text>
</svg>
